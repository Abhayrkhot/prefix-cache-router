name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: README numbers match results/
        run: python scripts/build_readme.py --check
      - name: Simulator smoke test (synthetic workload, packaged H200 step model)
        run: |
          pcrouter compare --synthetic shared-prefix --n 400 --rate 20 --workers 4 --kv-tokens 300000
      - name: Proxy end to end (fake workers, replay client)
        run: |
          pcrouter fake-worker --port 8101 --kv-tokens 300000 --speedup 20 &
          pcrouter fake-worker --port 8102 --kv-tokens 300000 --speedup 20 &
          sleep 2
          pcrouter serve --port 8100 --worker http://127.0.0.1:8101 --worker http://127.0.0.1:8102 &
          sleep 2
          pcrouter replay --url http://127.0.0.1:8100 --model fake --synthetic multiturn --n 40 \
            --rate 5 --think-s 1 --workers 2 --out /tmp/replay.jsonl
          python -c "import json; s=json.load(open('/tmp/replay.jsonl.json')); assert s['failed']==0 and s['hit_ratio']>0.2, s"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pcrouter .
      - run: docker run --rm pcrouter --help
