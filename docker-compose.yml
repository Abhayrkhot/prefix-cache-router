# Local demo: pcrouter in front of three fake vLLM workers (simulated H200 + Qwen2.5-7B with a
# real prefix cache), plus Prometheus. No GPU needed.
#   docker compose up -d
#   pcrouter replay --url http://127.0.0.1:8080 --model fake --synthetic multiturn --n 300 --rate 3 --think-s 2
#   open http://127.0.0.1:9090  (try: rate(pcrouter_cached_tokens_total[1m]) / rate(pcrouter_prompt_tokens_total[1m]))
services:
  worker-0: &worker
    build: .
    command: ["fake-worker", "--host", "0.0.0.0", "--port", "8000", "--kv-tokens", "400000"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"], interval: 5s}
  worker-1: *worker
  worker-2: *worker
  router:
    build: .
    command: ["serve", "--port", "8080", "--policy", "ttft",
              "--worker", "http://worker-0:8000", "--worker", "http://worker-1:8000",
              "--worker", "http://worker-2:8000"]
    ports: ["8080:8080"]
    depends_on: [worker-0, worker-1, worker-2]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
