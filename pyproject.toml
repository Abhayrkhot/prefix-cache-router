[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pcrouter"
version = "0.2.0"
description = "KV-cache-aware request router for LLM serving: one policy core, a trace-driven cluster simulator, and an OpenAI-compatible proxy validated on vLLM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhay Khot" }]
keywords = ["llm", "inference", "prefix-caching", "kv-cache", "routing", "load-balancing", "vllm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
server = ["aiohttp>=3.9", "prometheus-client>=0.19"]
plot = ["matplotlib>=3.7"]
dev = [
    "aiohttp>=3.9",
    "prometheus-client>=0.19",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "matplotlib>=3.7",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[project.scripts]
pcrouter = "pcrouter.cli:main"

[project.urls]
Repository = "https://github.com/Abhayrkhot/prefix-cache-router"

[tool.hatch.build.targets.wheel]
packages = ["src/pcrouter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "B905"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pcrouter"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pcrouter"]
omit = ["*/plots.py"]
